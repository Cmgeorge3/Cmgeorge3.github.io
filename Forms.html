
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Auto Service Form</title>

  <style>
    body {
      font-family: "Comic Sans MS", cursive;
      margin: 0;
      padding: 20px;
    }

    /* Holds the form and image side-by-side */
    .page-container {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 40px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Form section */
    .form-container {
      flex: 1;
    }

    /* Image section */
    .image-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .right-image {
      width: 100%;
      max-width: 950px;
      height: 650px;
      object-fit: fill;
      border: 2px solid black;
    }

    /* Submit button */
    button {
      transition: background-color 1s ease;
      color: black;
      background-color: white;
      padding: 10px 20px;
      border: 5px solid black;
      cursor: pointer;
    }

    button:hover {
      background-color: cyan;
    }

    /* Makes the page work better on phones */
    @media (max-width: 800px) {
      .page-container {
        flex-direction: column;
      }

      .image-container {
        width: 100%;
      }

      .right-image {
        max-width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="page-container">

    <!-- FORM ON THE LEFT -->
    <div class="form-container">

      <form action="https://formspree.io/f/mvkpaevy" method="POST">

        <table border="3">
          <tr>
            <th>Job Type</th>
            <th>Price $ per Task</th>
          </tr>

          <tr>
            <td>Brakes ($200 for both sets)</td>
            <td>$100</td>
          </tr>

          <tr>
            <td>Tire Rotation (prices vary depending on car model)</td>
            <td>$30-$60</td>
          </tr>
	  <tr>
            <td>Oil Change (Up-charge depending on oil filter location)</td>
            <td>$80</td>
          </tr>

        </table>

	<b><h2>Please contact me by number to confirm a day to service your Vehicle at: (252)-499-0867<h2></b>

       

        <b>
          <label for="jobType">Choose Job Type:</label>
          <select id="jobType" name="jobType" required>
            <option value="">-- Select a Job --</option>
            <option value="Brakes">Brakes</option>
            <option value="Tire Rotation">Tire Rotation</option>
	    <option value="Oil Change">Oil Change</option>

          </select>
        </b>

        <br><br>

        <b>
          <label for="serviceTypes">
            Choose Mobile or Dropoff Services:
          </label>

          <select id="serviceTypes" name="serviceTypes" required>
            <option value="">-- Select Service Type --</option>
            <option value="Come To me">Come To me</option>
            <option value="Come to you(up-Charge)">
              Come to you (up-Charge)
            </option>
          </select>
        </b>

       
        <br><br>

        <b>
          <label for="address">
            Address if Applicable (n/a if not):
          </label>

          <input
            type="text"
            id="address"
            name="address"
            required
          >
        </b>

        <br><br>

        <b>
          <label for="vehicle">
            Make/Model/Year:
          </label>

          <input
            type="text"
            id="vehicle"
            name="vehicle"
            required
          >
        </b>

        <br><br>

        <b>
          <button type="submit">
            Submit Form
          </button>
        </b>

      </form>

    </div>


    <!-- IMAGE ON THE RIGHT -->
    <div class="image-container">

      <img
        src="C:\Users\georg\OneDrive\Desktop\Chris' Car Care(CCC)\form_img1.png"
        alt="Automotive service"
        class="right-image"
      >

    </div>

  </div>

</body>
</html>
