<form action="https://formspree.io/f/mvkpaevy" method="POST">

  <table border="3">
    <tr>
      <th>Job Type</th>
      <th>Price $ per Task</th>
    </tr>

    <tr>
      <td>Oil Change (upcharge without oil and filter)</td>
      <td>$80</td>
    </tr>

    <tr>
      <td>Brakes (upcharge if I need to get them)</td>
      <td>$350</td>
    </tr>

    <tr>
      <td>Tire Rotation (prices vary depending on car model)</td>
      <td>$30-$60</td>
    </tr>
  </table>

  <br>

  <label for="jobType">Choose Job Type:</label>
  <select id="jobType" name="jobType" required>
    <option value="">-- Select a Job --</option>
    <option value="Oil Change">Oil Change</option>
    <option value="Brakes">Brakes</option>
    <option value="Tire Rotation">Tire Rotation</option>
  </select>

  <br><br>
  <label for="Dropoff or Mobile Services"> Choose Mobile or Dropoff Services:</label>
  <select id="Service Types" name="Service Types" required>
    <option value="">-- Select Service Type --</option>
    <option value="Come To me">Come To me</option>
    <option value="Come to you(upCharge)">Come to you(upCharge)</option>
    </select>

  <br><br>

  <label for="dropoffDate">Expected Dropoff/Pickup Date:</label>
  <input type="date" id="dropoffDate" name="dropoffDate" required>

  <br><br>

  <label for="dropoffTime">Expected Dropoff/Pickup Time:</label>
  <input type="time" id="dropoffTime" name="dropoffTime" required>

  <br><br>

  <label for="Address if Applicable (n/a if not)">Address if Applicable(n/a if not):</label>
  <input type="text" id="Address" name="Address" required>

  <br><br>

  <label for="Make/Model/Year">Make/Model/Year:</label>
  <input type="text" id="text" name="text" required>
  <br><br>

  <label for="Contact Info">Contact Info (Phone # or Email):</label>
  <input type="text" id="text" name="text" required>
  <br><br>

  <button type="submit">Submit Form</button>

</form>
